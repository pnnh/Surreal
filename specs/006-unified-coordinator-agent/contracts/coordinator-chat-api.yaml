openapi: 3.0.3
info:
  title: Surreal Coordinator Chat API
  version: 0.1.0
  description: 统一主聊天 Agent 与子任务协同接口
paths:
  /api/chat:
    post:
      summary: 发送消息给协调者 Agent 或答复挂起的子任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversationId
                - prompt
              properties:
                conversationId:
                  type: string
                  description: 会话 ID
                prompt:
                  type: string
                  description: 用户输入的自然语言内容
                skipClarification:
                  type: boolean
                  default: false
                  description: 是否显式跳过澄清直接生成
                locale:
                  type: string
                  enum: [en, zh]
                  default: zh
                model:
                  type: string
                  description: 可选指定的生图模型
      responses:
        '200':
          description: 处理成功，返回用户消息、Agent回复以及可能挂起/完成的子任务状态
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - userMessage
                  - assistantMessage
                properties:
                  ok:
                    type: boolean
                    example: true
                  userMessage:
                    type: object
                  assistantMessage:
                    type: object
                  coordinator:
                    type: object
                    properties:
                      intent:
                        type: string
                        enum: [chat, delegate, task_update]
                      subagentType:
                        type: string
                        enum: [image, icon, svg]
                  task:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                      subagentType:
                        type: string
                        enum: [image, icon, svg]
                      status:
                        type: string
                        enum: [in_grill, ready, generating, completed, failed, cancelled]
                      clarifyingQuestions:
                        type: array
                        items:
                          type: string
                      suggestedPrompt:
                        type: string
                      suggestedSizes:
                        type: array
                        items:
                          type: integer
                  generated:
                    type: object
                    nullable: true
                    description: 触发即时生成后的产物数据
        '400':
          description: 参数缺失或无效
        '404':
          description: 会话未找到
        '502':
          description: 上游 Poe API 调用异常

